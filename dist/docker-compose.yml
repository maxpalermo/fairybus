services:
  db:
    image: mariadb:10.11
    container_name: fairybus-db${FB_SUFFIX:-}
    restart: unless-stopped
    command:
      - --max_connections=300
      - --wait_timeout=300
      - --interactive_timeout=300
      - --connect_timeout=60
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fairybus-net

  pma:
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: fairybus-pma${FB_SUFFIX:-}
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fairybus-net

  app:
    image: ${APP_IMAGE:-fairybus-app:1.0.1}
    container_name: fairybus-app${FB_SUFFIX:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    environment:
      TZ: ${TZ}
      CI_ENVIRONMENT: production
    volumes:
      - ./app-src:/var/www/html
      - ./app.env:/var/www/html/.env:ro
      - app_writable:/var/www/html/writable
    depends_on:
      db:
        condition: service_healthy
      pma:
        condition: service_started
    networks:
      - fairybus-net

networks:
  fairybus-net:

volumes:
  db_data:
  app_writable:
