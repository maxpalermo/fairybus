<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Fairy Bus icon">
  <!-- Strada -->
  <line x1="2" y1="27" x2="30" y2="27" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- Corpo bus -->
  <rect x="2.5" y="5" width="27" height="15" rx="4" fill="#facc15" stroke="#000" stroke-width="2.5"/>
  <!-- Tetto/sopra -->
  <rect x="6" y="3" width="20" height="4" rx="2" fill="#000"/>
  <!-- Finestre -->
  <rect x="5" y="8" width="4.5" height="5" rx="1" fill="#6b7280" stroke="#000" stroke-width="1.5"/>
  <rect x="10.5" y="8" width="4.5" height="5" rx="1" fill="#6b7280" stroke="#000" stroke-width="1.5"/>
  <rect x="16" y="8" width="4.5" height="5" rx="1" fill="#6b7280" stroke="#000" stroke-width="1.5"/>
  <rect x="21.5" y="8" width="5" height="5" rx="1" fill="#6b7280" stroke="#000" stroke-width="1.5"/>
  <!-- Linea porta/decorazione laterale -->
  <line x1="5" y1="16" x2="27" y2="16" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <!-- Ruote -->
  <circle cx="8" cy="23" r="3.5" fill="#6b7280" stroke="#000" stroke-width="2.5"/>
  <circle cx="8" cy="23" r="1.3" fill="#000"/>
  <circle cx="24" cy="23" r="3.5" fill="#6b7280" stroke="#000" stroke-width="2.5"/>
  <circle cx="24" cy="23" r="1.3" fill="#000"/>
</svg>
